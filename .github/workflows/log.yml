name: Log Gym Occupancy

on:
  workflow_dispatch:

jobs:
  log:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests websocket-client pytz

      - name: Fetch and log occupancy
        run: python logger.py

      - name: Commit updated data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/occupancy.csv
          git diff --cached --quiet || git commit -m "Log occupancy [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
